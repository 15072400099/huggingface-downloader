name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    name: 语法检查 + 启动冒烟
    runs-on: windows-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Python 语法检查
        run: python -m compileall -q app

      - name: curl 可用性检查
        shell: pwsh
        run: |
          $ver = & curl.exe --version
          Write-Host "$($ver[0])"
          if ($LASTEXITCODE -ne 0) { throw "系统没有可用的 curl.exe" }

      - name: 批处理编码检查（必须是 GBK）
        shell: pwsh
        run: |
          $bad = @()
          $strict = [System.Text.Encoding]::GetEncoding('utf-8', [System.Text.EncoderFallback]::ExceptionFallback, [System.Text.DecoderFallback]::ExceptionFallback)
          Get-ChildItem *.bat | ForEach-Object {
            $bytes = [System.IO.File]::ReadAllBytes($_.FullName)
            try {
              $null = $strict.GetString($bytes)
              $hasChinese = [System.Text.Encoding]::GetEncoding(936).GetString($bytes) -match '[\u4e00-\u9fff]'
              if ($hasChinese) { $bad += $_.Name }
            } catch { }
          }
          if ($bad.Count -gt 0) {
            throw "这些批处理不是 GBK 编码，cmd 会解析错：$($bad -join ', ')"
          }
          Write-Host "批处理编码检查通过"

      - name: 启动服务并冒烟测试
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath python -ArgumentList "app/server.py" -PassThru -NoNewWindow
          $ready = $false
          foreach ($i in 1..40) {
            Start-Sleep -Milliseconds 750
            try {
              $ping = Invoke-RestMethod "http://127.0.0.1:8766/api/ping" -TimeoutSec 2
              if ($ping.ok) { $ready = $true; break }
            } catch { }
          }
          if (-not $ready) { throw "服务在 30 秒内没有启动" }

          $state = Invoke-RestMethod "http://127.0.0.1:8766/api/state" -TimeoutSec 10
          Write-Host "state ok: tasks=$($state.tasks.Count) endpoint=$($state.settings.endpoint) curl=$($state.versions.curl_version)"

          $page = Invoke-WebRequest "http://127.0.0.1:8766/" -UseBasicParsing -TimeoutSec 10
          if ($page.StatusCode -ne 200 -or $page.Content.Length -lt 500) { throw "首页没有正常返回" }

          foreach ($asset in @("/static/style.css", "/static/app.js", "/static/favicon.svg")) {
            $r = Invoke-WebRequest "http://127.0.0.1:8766$asset" -UseBasicParsing -TimeoutSec 10
            if ($r.StatusCode -ne 200) { throw "静态资源缺失：$asset" }
          }
          Write-Host "static ok"

          try { Invoke-RestMethod "http://127.0.0.1:8766/api/shutdown" -Method Post -TimeoutSec 5 | Out-Null } catch { }
          Write-Host "冒烟测试通过"
